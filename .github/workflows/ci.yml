name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-14
          - windows-2022
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf acl

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify frontend format
        run: pnpm format:check

      - name: Build frontend before Cargo on every OS
        run: pnpm build

      - name: Test Node helpers
        run: pnpm test:node

      - name: Test frontend
        run: pnpm test:frontend

      - name: Test all Rust binaries
        run: cargo test --no-fail-fast --manifest-path src-tauri/Cargo.toml --locked

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
