name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    env:
      WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
      LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
            artifact_name: darwin-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
            artifact_name: darwin-x86_64
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
            artifact_name: linux-x86_64
          - platform: windows-latest
            args: ''
            rust_target: ''
            artifact_name: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Test release artifact contract
        shell: bash
        run: python -m unittest discover -s tests -p 'test_release_artifacts.py' -v

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf gnupg

      - name: Test Linux signing
        if: runner.os == 'Linux'
        run: bash scripts/test-linux-signing.sh

      - name: Setup .NET for Artifact Signing
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Install pinned Windows signing tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'windows-signing'
          New-Item -ItemType Directory -Path $root | Out-Null
          $packages = @{
            'microsoft.windows.sdk.buildtools' = '10.0.26100.9169'
            'microsoft.artifactsigning.client' = '1.0.128'
          }
          foreach ($id in $packages.Keys) {
            $version = $packages[$id]
            $zip = Join-Path $root "$id.zip"
            Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/$id/$version/$id.$version.nupkg" -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $root $id)
          }
          $tools = @(Get-ChildItem "$root/microsoft.windows.sdk.buildtools/bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.Directory.Name -eq 'x64' })
          if ($tools.Count -ne 1) { throw 'Expected exactly one x64 SignTool' }
          $dlib = Join-Path $root 'microsoft.artifactsigning.client/bin/x64/Azure.CodeSigning.Dlib.dll'
          if (-not (Test-Path -LiteralPath $dlib -PathType Leaf)) { throw 'Missing Artifact Signing dlib' }
          "WINDOWS_SIGNTOOL_PATH=$($tools[0].FullName)" >> $env:GITHUB_ENV
          "WINDOWS_SIGNING_DLIB=$dlib" >> $env:GITHUB_ENV

      - name: Test Windows signing
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-signing.ps1

      - name: Validate signing prerequisites
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          LINUX_SIGNING_PUBLIC_KEY: ${{ vars.LINUX_SIGNING_PUBLIC_KEY }}
        run: |
          python - <<'PY'
          import json, os, pathlib, tomllib
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          versions = [json.loads(pathlib.Path(p).read_text())['version']
                      for p in ('package.json', 'src-tauri/tauri.conf.json')]
          versions.append(tomllib.loads(pathlib.Path('src-tauri/Cargo.toml').read_text())['package']['version'])
          if any(v != version for v in versions):
              raise SystemExit('Release tag must match all application versions')
          required = []
          if os.environ['RUNNER_OS'] == 'Windows':
              required = ['AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID',
                          'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT',
                          'AZURE_SIGNING_CERTIFICATE_PROFILE', 'WINDOWS_SIGNING_SUBJECT']
          if os.environ['RUNNER_OS'] == 'Linux':
              required = ['LINUX_SIGNING_PUBLIC_KEY', 'LINUX_SIGNING_KEY_FINGERPRINT']
          for name in required:
              if not os.environ.get(name, '').strip():
                  raise SystemExit(f'Missing signing prerequisite: {name}')
          PY

      - name: Configure Windows signing hook
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'windows-signing'
          $metadata = Join-Path $root 'metadata.json'
          @{
            Endpoint = $env:AZURE_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT
            CertificateProfileName = $env:AZURE_SIGNING_CERTIFICATE_PROFILE
            ExcludeCredentials = @(
              'EnvironmentCredential', 'ManagedIdentityCredential', 'WorkloadIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential'
            )
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $metadata -Encoding utf8
          $config = Join-Path $root 'tauri.windows-signing.json'
          $wrapper = Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-signing.ps1'
          @{
            bundle = @{ windows = @{ signCommand = @{
              cmd = (Get-Command pwsh).Source
              args = @('-NoProfile', '-File', $wrapper, '-Mode', 'sign', '-FilePath', '%1')
            } } }
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $config -Encoding utf8
          "WINDOWS_SIGNING_METADATA=$metadata" >> $env:GITHUB_ENV
          "WINDOWS_SIGNING_CONFIG=$config" >> $env:GITHUB_ENV

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Apple code signing
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          CERT_PATH=$RUNNER_TEMP/certificate.p12

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "actions" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Setup Apple notarization
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; then
            echo "Missing Apple notarization secrets. Configure APPLE_ID and APPLE_PASSWORD." >&2
            exit 1
          fi

      - name: Precompile Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: pnpm tauri build --no-bundle --config "$WINDOWS_SIGNING_CONFIG"

      - name: Login to Azure with OIDC
        if: runner.os == 'Windows'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Cache Windows signing token
        if: runner.os == 'Windows'
        shell: bash
        run: az account get-access-token --scope https://codesigning.azure.net/.default --output none

      - name: Build Tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Sign only here; notarization runs once on the DMG via notarytool below.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo 'Missing signing prerequisite: TAURI_SIGNING_PRIVATE_KEY' >&2
            exit 1
          fi
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -File scripts/windows-signing.ps1 -Mode sign -FilePath src-tauri/target/release/skillreg-local.exe
            pnpm tauri bundle --config "$WINDOWS_SIGNING_CONFIG"
          else
            pnpm tauri build ${{ matrix.args }}
          fi

      - name: Validate signed macOS app bundles
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          apps_found=0

          while IFS= read -r app; do
            [ -n "$app" ] || continue
            apps_found=$((apps_found + 1))

            echo "Validating $app"
            codesign -dv --verbose=4 "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done < <(find src-tauri/target -path "*/release/bundle/macos/*.app" -type d)

          if [ "$apps_found" -eq 0 ]; then
            echo "No macOS app bundle found to validate." >&2
            exit 1
          fi

      - name: Notarize and staple macOS DMGs
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          dmgs_found=0
          team_id="${APPLE_TEAM_ID:-65XLRQ2U8B}"
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; then
            echo "Missing Apple notarization secrets in DMG step." >&2
            exit 1
          fi
          notary_args=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$team_id" --wait)

          while IFS= read -r dmg; do
            [ -n "$dmg" ] || continue
            dmgs_found=$((dmgs_found + 1))

            echo "Submitting $dmg for notarization"
            xcrun notarytool submit "$dmg" "${notary_args[@]}"

            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done < <(find src-tauri/target -path "*/release/bundle/dmg/*.dmg" -type f)

          if [ "$dmgs_found" -eq 0 ]; then
            echo "No macOS DMG found to notarize." >&2
            exit 1
          fi

      - name: Select release artifacts
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.artifact_name }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          bundle="src-tauri/target/release/bundle"
          if [ -n "$RUST_TARGET" ]; then
            bundle="src-tauri/target/$RUST_TARGET/release/bundle"
          fi
          python scripts/release-artifacts.py collect --bundle "$bundle" \
            --platform "$RELEASE_PLATFORM" --output artifacts

      - name: Sign and verify Linux artifacts
        if: runner.os == 'Linux'
        env:
          LINUX_SIGNING_PRIVATE_KEY: ${{ secrets.LINUX_SIGNING_PRIVATE_KEY }}
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_SIGNING_PASSPHRASE }}
          LINUX_SIGNING_PUBLIC_KEY: ${{ vars.LINUX_SIGNING_PUBLIC_KEY }}
        run: |
          python - <<'PY'
          import json, subprocess
          files = json.loads(subprocess.check_output([
              'python', 'scripts/release-artifacts.py', 'files',
              '--directory', 'artifacts', '--platform', 'linux-x86_64'
          ], text=True))
          subprocess.run(['bash', 'scripts/linux-signing.sh', 'sign', '--', *files], check=True)
          PY

      - name: Verify Windows artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/windows-signing.ps1 -Mode verify-artifacts -ArtifactDirectory artifacts `
            -ApplicationPath src-tauri/target/release/skillreg-local.exe

      - name: Record verified inventory
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.artifact_name }}
        run: |
          identity=()
          if [ "$RUNNER_OS" = Windows ]; then
            identity+=(--windows-subject "$WINDOWS_SIGNING_SUBJECT")
          elif [ "$RUNNER_OS" = Linux ]; then
            identity+=(--linux-fingerprint "$LINUX_SIGNING_KEY_FINGERPRINT")
          fi
          python scripts/release-artifacts.py record --directory artifacts \
            --platform "$RELEASE_PLATFORM" --commit "$GITHUB_SHA" \
            --version "${GITHUB_REF_NAME#v}" "${identity[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact_name }}
          path: artifacts/
          if-no-files-found: error

      - name: Remove Windows signing configuration
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'windows-signing'
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
      LINUX_SIGNING_PUBLIC_KEY: ${{ vars.LINUX_SIGNING_PUBLIC_KEY }}
      LINUX_SIGNING_KEY_FINGERPRINT: ${{ vars.LINUX_SIGNING_KEY_FINGERPRINT }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install public signature verifier
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: downloaded

      - name: Prepare verified release
        run: |
          python scripts/release-artifacts.py prepare --input downloaded --output release-assets \
            --commit "$GITHUB_SHA" --tag "$GITHUB_REF_NAME" --repository "$GITHUB_REPOSITORY" \
            --windows-subject "$WINDOWS_SIGNING_SUBJECT" \
            --linux-fingerprint "$LINUX_SIGNING_KEY_FINGERPRINT" \
            --publication release-publication.json --notes release-notes.md

      - name: Verify transferred Linux signatures
        run: |
          python - <<'PY'
          import json, subprocess
          files = json.loads(subprocess.check_output([
              'python', 'scripts/release-artifacts.py', 'files',
              '--directory', 'downloaded/build-linux-x86_64', '--platform', 'linux-x86_64'
          ], text=True))
          subprocess.run(['bash', 'scripts/linux-signing.sh', 'verify', '--', *files], check=True)
          PY

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          publication = json.loads(pathlib.Path('release-publication.json').read_text())
          subprocess.run([
              'gh', 'release', 'create', publication['tag'], *publication['assets'],
              '--repo', os.environ['GITHUB_REPOSITORY'], '--verify-tag',
              '--title', f"SkillReg v{publication['version']}",
              '--notes-file', 'release-notes.md', '--draft',
          ], check=True)
          PY
