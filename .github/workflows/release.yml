name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
            artifact_name: darwin-aarch64
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: x86_64-apple-darwin
            artifact_name: darwin-x86_64
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
            artifact_name: linux-x86_64
          - platform: windows-latest
            args: ''
            rust_target: ''
            artifact_name: windows-x86_64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Apple code signing
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          CERT_PATH=$RUNNER_TEMP/certificate.p12

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "actions" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "actions" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "actions" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Setup Apple notarization
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; then
            echo "Missing Apple notarization secrets. Configure APPLE_ID and APPLE_PASSWORD." >&2
            exit 1
          fi

      - name: Build Tauri
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Sign only here; notarization runs once on the DMG via notarytool below.
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npx tauri build ${{ matrix.args }}

      - name: Validate signed macOS app bundles
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          apps_found=0

          while IFS= read -r app; do
            [ -n "$app" ] || continue
            apps_found=$((apps_found + 1))

            echo "Validating $app"
            codesign -dv --verbose=4 "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          done < <(find src-tauri/target -path "*/release/bundle/macos/*.app" -type d)

          if [ "$apps_found" -eq 0 ]; then
            echo "No macOS app bundle found to validate." >&2
            exit 1
          fi

      - name: Notarize and staple macOS DMGs
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          dmgs_found=0
          team_id="${APPLE_TEAM_ID:-65XLRQ2U8B}"
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_PASSWORD" ]; then
            echo "Missing Apple notarization secrets in DMG step." >&2
            exit 1
          fi
          notary_args=(--apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$team_id" --wait)

          while IFS= read -r dmg; do
            [ -n "$dmg" ] || continue
            dmgs_found=$((dmgs_found + 1))

            echo "Submitting $dmg for notarization"
            xcrun notarytool submit "$dmg" "${notary_args[@]}"

            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done < <(find src-tauri/target -path "*/release/bundle/dmg/*.dmg" -type f)

          if [ "$dmgs_found" -eq 0 ]; then
            echo "No macOS DMG found to notarize." >&2
            exit 1
          fi

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          echo "=== All bundle files ==="
          find src-tauri/target -path "*/release/bundle/*" -type f \( \
            -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \
            -o -name "*.deb" -o -name "*.rpm" \
            -o -name "*.AppImage" -o -name "*.AppImage.sig" \
            -o -name "*.exe" -o -name "*.exe.sig" -o -name "*.msi" -o -name "*.msi.sig" \
          \) | while read f; do
            echo "  $(basename "$f")"
            cp "$f" artifacts/
          done
          echo "=== Collected ==="
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.artifact_name }}
          path: artifacts/*

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist

      - name: Prepare complete native updater manifest
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          node scripts/generate-updater-manifest.mjs \
            --artifacts dist --output updater \
            --version "${TAG#v}" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --base-url "https://github.com/${GH_REPO}/releases/download/${TAG}"

      - name: Create draft release and upload validated assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --repo "$GH_REPO" \
            --title "SkillReg v${TAG#v}" \
            --notes "See the assets below for download links." \
            --draft

          # Native NSIS and AppImage updaters are already in the prepared directory.
          find dist -type f \( -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" -o -name "*.msi" \) -print0 | while IFS= read -r -d '' asset; do
            gh release upload "$TAG" "$asset" --repo "$GH_REPO" --clobber
          done
          for asset in updater/*; do
            gh release upload "$TAG" "$asset" --repo "$GH_REPO" --clobber
          done
